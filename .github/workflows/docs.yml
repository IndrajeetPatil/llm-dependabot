name: Docs

# Builds the Zensical site on pull requests and deploys it to GitHub Pages
# from main; start it by hand to redeploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  docs:
    uses: IndrajeetPatil/workflows/.github/workflows/python-docs.yaml@main
    permissions:
      contents: read
      pages: write # Required to deploy GitHub Pages.
      id-token: write # Required for Pages OIDC authentication.
