name: Mutation Testing

# Full mutmut runs take several minutes, so only pull requests that can
# change a mutant's fate run them: changes to the source, the tests, or the
# tools and configuration they run with.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mutation-test.yml"
      - ".python-version"
      - "Makefile"
      - "app/**"
      - "config.yaml"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    name: Mutation testing (mutmut)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Kill every mutant
        run: make mutation-test
