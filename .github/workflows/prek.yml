name: prek

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: prek hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The private-names hook is a uv script.
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-python: true

      # A hook that rewrites a file fails the step.
      - name: Run prek hooks
        uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: latest-known
          extra-args: --all-files --stage pre-commit
        env:
          # qa.yml already runs ruff and ty through `make check`, and
          # security.yml scans the complete history with Gitleaks and audits
          # the workflows with zizmor. The lock check needs the gh-actions-lock
          # extension. no-commit-to-branch guards local commits only, so CI
          # never fails on main if this workflow gains a push trigger.
          SKIP: ruff-check,ruff-format,ty,gitleaks,zizmor,actions-lock-verify,no-commit-to-branch
