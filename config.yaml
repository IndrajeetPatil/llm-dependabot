# Which prompts run, where, and when; shared by public and private repositories.
#
# Every non-archived, non-fork public repository owned by `owner` that contains
# at least one of the `prompts` is picked up automatically. Private
# repositories are opt-in: list them in private.yaml (git-ignored; see
# private.example.yaml).
#
# Each repository joins the first group whose `languages` include its GitHub
# primary language; the group with `languages: ["*"]` takes the rest. Times are
# local wall-clock times (24-hour). Run `make install` after editing
# either file so launchd picks up the change.

owner: IndrajeetPatil

# Prompts that repositories opt into by committing them at `path`. A weekly
# prompt runs at every scheduled run of its repository's group; a monthly one at
# the group's first scheduled run of each calendar month. Groups can override
# `cadence` per prompt.
prompts:
  - name: update-deps
    path: .github/prompts/update-deps.md
    cadence: weekly

  - name: simplify-codebase
    path: .github/prompts/simplify-codebase.md
    cadence: monthly

# Existing clones are reused from here; missing ones are cloned here and
# deleted again once their pull request is merged or closed.
clone_root: ~/Documents/GitHub

# The coding agent that runs each repository's prompt, unattended, in a fresh
# worktree. In `command`, an argument that is exactly "{prompt}" becomes the
# prompt's text (without one, the prompt goes to standard input), and
# "{timeout_hours}" becomes agent_timeout_hours. `check` must succeed once the
# agent is installed and signed in; `make setup` waits for it. See
# docs/configuration.md for other agents.
agent:
  name: Antigravity CLI
  command:
    - agy
    - --dangerously-skip-permissions
    - --print-timeout
    - "{timeout_hours}h"
    - -p
    - "{prompt}"
  check: [agy, models]

# Upper bound for one repository's agent run.
agent_timeout_hours: 4

# How often to check pending pull requests and clean up after merged ones.
cleanup_interval_hours: 3

# Scheduled runs and cleanups do nothing on Saturdays and Sundays, including
# jobs that launchd catches up on after the Mac wakes. Groups cannot be
# scheduled on a weekend while this is on.
skip_weekends: true

groups:
  - name: web
    languages: [TypeScript, JavaScript, Astro, Svelte, Vue, HTML, CSS]
    weekday: Monday
    time: "11:00"

  - name: python
    languages: [Python]
    weekday: Tuesday
    time: "11:00"

  - name: workflows
    languages: ["*"]
    weekday: Wednesday
    time: "11:00"

  # R packages update monthly, so they run on the first Thursday of the month.
  - name: r
    languages: [R]
    weekday: Thursday
    time: "11:00"
    cadence:
      update-deps: monthly
