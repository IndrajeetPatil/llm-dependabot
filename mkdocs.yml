site_name: llm-dependabot
site_description: A software giga factory for scheduled, agent-driven repository maintenance
site_url: https://www.indrapatil.com/llm-dependabot/
site_author: IndrajeetPatil

repo_name: llm-dependabot
repo_url: https://github.com/IndrajeetPatil/llm-dependabot

edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Setup: setup.md
  - Configuration: configuration.md
  - Usage: usage.md
  - Autonomous evolution: autonomy.md
  - Architecture: architecture.md
  - Development: development.md
  - Integrations:
      - LLMs: integrations/llms.md

# The illustration prompts are sources for the figures, not pages.
exclude_docs: |
  images/README.md
  images/*.prompt.txt

theme:
  name: material
  custom_dir: overrides
  logo: images/logo.png
  favicon: images/favicon.ico
  features:
    - content.code.annotate
    - content.code.copy
    - content.action.edit
    - content.action.view
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.path
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green
      accent: deep purple

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: blue
      accent: deep orange

markdown_extensions:
  - admonition
  - attr_list:
  - md_in_html:
  - pymdownx.details
  - pymdownx.snippets:
  - pymdownx.magiclink:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite:
  - pymdownx.keys:
  # GitHub callouts (> [!NOTE]) render as admonitions, so the README and the
  # docs use one syntax on GitHub and on the site.
  - pymdownx.quotes:
      callouts: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      anchorlink: true
      anchorlink_class: "toclink"

plugins:
  - search
  - tags
  - llmstxt:
      enabled: true
      full_output: llms-full.txt
      markdown_description: |-
        llm-dependabot runs the prompts that repositories commit, such as dependency updates,
        refactoring, and codebase simplification, with a coding agent on a schedule.
        The agent opens a pull request for review; any agent with a non-interactive mode works.
      sections:
        Home documentation:
          - index.md
        Guides:
          - setup.md
          - configuration.md
          - usage.md
          - autonomy.md
          - architecture.md
          - development.md
        Integrations:
          - integrations/llms.md

validation:
  omitted_files: error
  absolute_links: error
  unrecognized_links: error
  anchors: error

extra:
  analytics:
    provider: google
    property: G-3BQ49J7KYH
