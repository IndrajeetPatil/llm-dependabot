minimum_prek_version = "0.5.11"
default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

[[repos]]
repo = "meta"
hooks = [
  { id = "check-hooks-apply" },
  { id = "check-useless-excludes" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "ef6cf06c079dd6b299dfc720b0f14400c9d168e1"  # frozen: v0.17.5
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "local"
hooks = [
  # ty runs in the script's own environment, which holds its dependencies.
  { id = "ty", name = "ty", entry = "make typecheck", language = "system", pass_filenames = false, files = "\\.py$" },
  # Keep private repository names out of files and commit messages.
  { id = "private-names", name = "no private repository names", entry = "hooks/check_private_names.py", language = "system", stages = ["pre-commit", "commit-msg"] },
]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-added-large-files", args = ["--enforce-all"] },
  { id = "detect-private-key" },
  { id = "fix-byte-order-marker" },
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  { id = "destroyed-symlinks" },
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-vcs-permalinks" },
  { id = "no-commit-to-branch", args = ["--branch=main"] },
]
