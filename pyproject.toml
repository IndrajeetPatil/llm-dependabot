[project]
name = "llm-dependabot"
version = "1.0.0"
description = "Run each repository's prompts with a coding agent on a weekly or monthly cadence"
readme = "README.md"
authors = [
  { name = "Indrajeet Patil", email = "patilindrajeet.science@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
keywords = ["automation", "coding-agent", "dependencies", "launchd", "maintenance"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = [
  "filelock>=4.3.1",
  "pydantic>=2.14.4",
  "pyyaml>=6.0.4",
  "typer>=0.29.3",
]

[project.scripts]
llm-dependabot = "llm_dependabot.cli:app"

[project.urls]
Homepage = "https://github.com/IndrajeetPatil/llm-dependabot"
Documentation = "https://www.indrapatil.com/llm-dependabot/"
Repository = "https://github.com/IndrajeetPatil/llm-dependabot"
Issues = "https://github.com/IndrajeetPatil/llm-dependabot/issues"
Changelog = "https://www.indrapatil.com/llm-dependabot/changelog/"

[dependency-groups]
# Development tools, locked in uv.lock so new rules arrive only through a
# reviewed dependency update; scheduled runs use --no-dev and never install them.
dev = [
  "coverage>=7.17.5",
  "deptry>=0.25.1",
  "mutmut>=3.8.1",
  "pyrefly>=1.5.0",
  "pytest>=9.2.0",
  "pytest-random-order>=1.2.0",
  "ruff>=0.17.6",
  "ty>=0.0.111",
  "unref>=0.5.1",
]
# Installed only for `make docs`; scheduled runs never need it.
docs = ["zensical>=0.1.3"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.0"
# Use only Python builds that uv downloads and manages, never the system's or
# Homebrew's, so development, CI, and scheduled runs share one interpreter,
# and setup-uv can cache it in CI.
python-preference = "only-managed"

[tool.pytest]
# Strict mode enables strict_config, strict_markers, strict_parametrization_ids,
# and strict_xfail, plus any strictness options future pytest releases add. The
# dev group pins pytest, so new options arrive only through a reviewed update.
strict = true
minversion = "9.2"
required_plugins = ["pytest-random-order"]
# A parametrize with no cases fails collection instead of silently skipping.
empty_parameter_set_mark = "fail_at_collect"
# Collect only tests defined in test modules, not ones they import.
collect_imported_tests = false
addopts = [
  # Summarise every outcome other than a pass.
  "-ra",
  # Shuffle the order, so tests cannot depend on one another.
  "--random-order",
  # Import test modules without changing sys.path.
  "--import-mode=importlib",
]
testpaths = ["tests"]
# Every warning, including deprecations from dependencies, fails its test.
filterwarnings = ["error"]
# Isolates every test from the real home directory (see tests/conftest.py).
usefixtures = ["home"]

[tool.coverage.run]
branch = true
source = ["llm_dependabot"]

[tool.coverage.report]
# Every line and branch is tested; macOS and network calls are faked.
fail_under = 100
precision = 2
show_missing = true
skip_covered = true
skip_empty = true

[tool.mutmut]
source_paths = ["src/llm_dependabot/"]
# Tests compile the app bundle's sources and validate the committed config.
also_copy = [
  "app/",
  "config.yaml",
]
pytest_add_cli_args_test_selection = ["tests/"]
# Mutate only lines the suite runs; full coverage makes this every line.
mutate_only_covered_lines = true
# Nothing is excluded: do_not_mutate takes only whole-file globs. Kill a
# surviving mutant with a test, or restructure the source so it cannot
# express the mutation.

[tool.ruff]
target-version = "py314"
line-length = 88
preview = true

[tool.ruff.lint]
# missing-trailing-comma stays on, so multi-line calls and collections keep
# one item per line; `make format` applies its fixes before the formatter,
# which would otherwise collapse them.
select = ["ALL"]
ignore = [
  # The repository-level LICENSE covers every file.
  "missing-copyright-notice",
  # gh's JSON output is untyped.
  "any-type",
  # Docstrings say what a function does and why; Returns, Yields, and Raises
  # sections would only restate the signature (see AGENTS.md).
  "docstring-missing-returns",
  "docstring-missing-yields",
  "docstring-missing-exception",
  # Short inline exception messages are clearer here.
  "EM",
  "raise-vanilla-args",
  # Local wall-clock time is intended for logs and branch names.
  "call-datetime-now-without-tzinfo",
  # Running git, gh, launchctl, and the agent is the CLI's job. Arguments are
  # built from lists, never a shell, and the tools are resolved from the
  # login PATH.
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "start-process-with-partial-path",
  # print is the CLI's output.
  "print",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  # pytest checks with plain assert statements.
  "assert",
  # Expected values read better inline than as named constants.
  "magic-value-comparison",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["llm_dependabot"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "llm_dependabot.config.Strict",
]

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ty.src]
exclude = [".venv", "build", "dist", "docs"]

[tool.ty.environment]
# The oldest supported version, so newer-only APIs are flagged; .python-version
# picks the newer interpreter that development and scheduled runs use.
python-version = "3.14"
# The CLI runs only on macOS; check it against macOS APIs on any runner.
python-platform = "darwin"

[tool.ty.rules]
# Enable every current diagnostic, including soundness and suppression checks that
# ty leaves disabled by default. The dev group pins ty in uv.lock, so new rules
# arrive only through a reviewed dependency update.
all = "error"

[tool.ty.analysis]
# Prefer sound narrowing over convenience assumptions at external-data boundaries.
respect-type-ignore-comments = false
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.deptry]
known_first_party = ["llm_dependabot"]

[tool.unref]
show-transitive = true
