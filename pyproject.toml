[project]
name = "llm-dependabot"
version = "0.1.0"
description = "Run each repository's prompts with a coding agent on a weekly or monthly cadence"
readme = "README.md"
license = "MIT"
requires-python = ">=3.15"
dependencies = [
  "filelock>=4.3.1",
  "pydantic>=2.14.4",
  "pyyaml>=6.0.4",
  "typer>=0.29.2",
]

[project.scripts]
llm-dependabot = "llm_dependabot.cli:app"

[dependency-groups]
# Tests and type-checking; `uv run` installs it by default, scheduled runs never.
dev = ["pytest>=9.2.0"]
# Installed only for `make docs`; scheduled runs never need it.
docs = ["zensical>=0.1.3"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.0"

[tool.pytest]
testpaths = ["tests"]
strict = true
addopts = ["-ra"]

[tool.ruff]
target-version = "py315"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # conflicts with the formatter
  "CPY001",  # no copyright headers
  "ANN401",  # gh JSON output is untyped
  "D",       # the module docstring documents the CLI
  "EM",      # short inline exception messages are clearer here
  "DTZ005",  # local wall-clock time is intended for logs and branch names
  "S603",    # subprocess arguments are built from lists, never a shell
  "S607",    # agy, gh, git, and launchctl are resolved from the login PATH
  "T201",    # print is the CLI's output
  "TRY003",  # see EM
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # pytest asserts with plain assert
  "PLR2004", # expected values read better inline than as named constants
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "llm_dependabot.config.Strict",
]

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ty.src]
exclude = [".venv", "build", "dist", "docs"]

[tool.ty.environment]
python-version = "3.15"
# The CLI runs only on macOS; check it against macOS APIs on any runner.
python-platform = "darwin"

[tool.ty.rules]
# Enable every current diagnostic, including soundness and suppression checks that
# ty leaves disabled by default. Pinning ty in uv.lock keeps new rules from arriving
# silently between dependency updates.
all = "error"

[tool.ty.analysis]
# Prefer sound narrowing over convenience assumptions at external-data boundaries.
respect-type-ignore-comments = false
strict-equality-semantics = true
strict-generic-narrowing = true
