# Documentation site, built with `make docs` and previewed with `make docs-serve`.

[project]
site_name = "llm-dependabot"
site_description = "Dependabot, but an LLM agent does the updating."
site_author = "Indrajeet Patil"
site_url = "https://www.indrapatil.com/llm-dependabot/"
repo_name = "IndrajeetPatil/llm-dependabot"
repo_url = "https://github.com/IndrajeetPatil/llm-dependabot"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; Indrajeet Patil"

nav = [
  { "Home" = "index.md" },
  { "Setup" = "setup.md" },
  { "Configuration" = "configuration.md" },
  { "Usage" = "usage.md" },
  { "Architecture" = "architecture.md" },
  { "Development" = "development.md" },
]

# The illustration prompts and their companions are sources, not pages.
exclude_docs = """
images/README.md
images/*.prompt.txt
"""

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
logo = "images/logo.png"
favicon = "images/logo.png"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Hanken Grotesk"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
